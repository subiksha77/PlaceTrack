# Database Configuration
# Use environment variables for sensitive data
# Set DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD as env vars
# Or use the defaults below for local development

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:placetrack_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:your_mysql_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Server Port
server.port=8080

# Application Name
spring.application.name=PlaceTrack

# Jackson - handle dates properly
spring.jackson.serialization.write-dates-as-timestamps=false

# ===== Resume upload (Phase A) =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Local storage folder for uploaded resumes (kept outside the web root)
placetrack.upload.dir=${UPLOAD_DIR:./uploads}
